name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, pruebas, build y contrato
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://nucleo:nucleo_local@127.0.0.1:5433/brecha?schema=nucleo
      DATABASE_URL_PRUEBAS: postgresql://nucleo:nucleo_local@127.0.0.1:5433/brecha_pruebas?schema=nucleo
      IA_DATABASE_URL: postgresql+psycopg://ia:ia_local@127.0.0.1:5433/brecha
      IA_DATABASE_URL_PRUEBAS: postgresql+psycopg://ia:ia_local@127.0.0.1:5433/brecha_pruebas
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: services/ia/uv.lock

      - name: Dependencias del servicio con IA (Python con uv)
        working-directory: services/ia
        run: uv sync --frozen

      - name: Levantar PostgreSQL (mismo compose que en local)
        run: docker compose --profile liviano up -d --wait

      - name: Generar clientes (prisma generate)
        run: pnpm turbo run generar

      - name: Migrar el esquema ia (Alembic) en las dos bases
        working-directory: services/ia
        run: |
          uv run alembic upgrade head
          IA_DATABASE_URL_MIGRAR="$IA_DATABASE_URL_PRUEBAS" uv run alembic upgrade head

      - name: Formato
        run: pnpm format:check

      - name: Lint y reglas de capas
        run: pnpm turbo run lint

      - name: Tipos
        run: pnpm turbo run typecheck

      - name: Pruebas
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Navegador para Playwright
        run: pnpm --filter consola exec playwright install --with-deps chromium

      - name: Playwright del flujo de F1-14 con axe (consola contra el núcleo real)
        run: pnpm turbo run e2e

      - name: Informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/consola/playwright-report
          retention-days: 7

      - name: Contrato sin cambios sin commitear
        run: |
          pnpm turbo run contrato:exportar
          git diff --exit-code -- packages/contratos || (echo "::error::openapi.json o los tipos cambiaron: corre 'pnpm turbo run contrato:exportar' y commitea" && exit 1)

      - name: Sin datos privados en el repo
        run: |
          if git ls-files | grep -q '^datos/privado/'; then echo "::error::datos/privado/ no puede ir al repo (ADR 0008)"; exit 1; fi
