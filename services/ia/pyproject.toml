[project]
name = "brecha-ia"
version = "0.0.0"
description = "Servicio con IA de Brecha: vigía del correo, señales, avisos y RAG (F2)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "pgvector==0.5.1",
  "openai==3.58.0",
  "imapclient==4.3.0",
  "keyring==25.7.0",
  "httpx==0.28.1",
]

[project.scripts]
ia = "ia.entradas.cli:main"
brecha-ia = "ia.entradas.servicio:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "freezegun==1.5.5",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "import-linter==2.17",
  "pyinstaller==6.22.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ia"]

[[tool.mypy.overrides]]
module = ["imapclient.*", "keyring.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-name = "ia"

[tool.ruff.lint.isort]
known-first-party = ["ia"]
known-third-party = ["alembic"]
